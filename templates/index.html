<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" type="text/css" href="/static/stylesheet.css">
    <title>Elbow Smart:Fuzzy Logic System</title>
</head>
<style>
        .form-group {
            display: flex;
            align-items: center;
        }

        .form-select select{
            display: flex;
            align-items: right;
        }
        .form-group label {
            margin-right: 60px;
            white-space: nowrap;
        }
        .form-group input {
            margin-left: 10px;
            size:10;
        }
       .form-container {
            width: 80%; /* Adjust this value as needed */
            max-width: 800px; /* Optional: set a maximum width */
            margin: 0 auto; /* Center the form on the page */
            border: 1px solid #ccc; /* Optional: add a border */
            padding: 20px; /* Optional: add spacing inside the form */
            box-sizing: border-box; /* Include padding in the width calculation */
        }
    </style>
<body>
    <h1>Active ROM & Strength Analyzer</h1>
     <div style="display: flex; align-items: flex-start;">
     <table align="center" border="1">
     <tr>
     <td width="30">
     <table>
     <tr valign="top"><td><img src="/static/TennisElbow.png" alt="Tennis Elbow" style="width: 250px; height: auto; margin-right: 20px;">
     </td></tr>
     <tr></tr>
     <tr valign="bottom"><td><img src="/static/ElbowStrength.png" alt="Tennis Strength" style="width: 250px; height: auto; margin-right: 20px;">
     </td></tr>
     </table>
     </td>
     <td>
    <form action="/calculate" method="post" >
    <h2>Enter ROM values</h2>
            <table>
        <tr><td>    <label>Elbow Flexion(69&deg; to 180&deg;):</label> </td>
            <td>    <input type="number" name="flexion" required value="145"></td></tr>
                <tr><td>
                <label>Elbow Extension(-5&deg; to 8&deg;):</label></td><td>
        <input type="number" name="extension" required value="1"><br><br>
                  <tr><td>
                 <label>Elbow Pronation(30&deg; to 100&deg;):</label></td><td>
        <input type="number" name="pronation" required value="80"><br><br>
             </td></tr>
    <tr><td>  <label>Elbow Supination(0&deg; to 100&deg;):</label></td><td>
        <input type="number" name="supination" required value="86"><br><br>
     </td></tr>
            <tr><td>
        <label>Wrist Extension(20&deg; to 75&deg;):</label></td><td>
        <input type="number" name="wextension" required value="55"><br><br>
     </td></tr>
             <tr><td>   <label>Pain Level:</label></td><td>
        <select id="painlevel" name="painlevel">
        <option value="None">None</option>
        <option value="Low">Low</option>
        <option value="Moderate">Moderate</option>
        <option value="Severe">Severe</option>
        </select>
     </td></tr>
     <tr></tr>
     <tr></tr>
     <tr></tr>
      <tr><td colspan=2 align="center">
        <input type="submit" value="Submit">
          </td></tr>
     </table>
    </form>
         </td>
     </tr>
     </table>
   </div>
</body>
</html>
