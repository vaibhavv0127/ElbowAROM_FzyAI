<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="/static/stylesheet.css">
    <title>Elbow Smart: Active ROM &amp; Strength Analyzer</title>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v6.5a3 3 0 0 0 3 3h8"/><path d="M16 13.5 12.5 10M16 13.5 12.5 17"/></svg>
            </div>
            <div>
                <div class="brand-name">Elbow Smart</div>
                <div class="brand-sub">Fuzzy logic assessment</div>
            </div>
        </div>
    </header>

    <main class="page">
        <h1>Active ROM &amp; Strength Analyzer</h1>
        <p class="lede">Enter the patient’s active range-of-motion measurements in degrees, plus the current pain level, to assess the elbow.</p>

        <div class="layout">
            <aside class="visuals" aria-label="Reference images">
                <figure>
                    <img src="/static/TennisElbow.png" alt="Tennis Elbow">
                </figure>
                <figure>
                    <img src="/static/ElbowStrength.png" alt="Tennis Strength">
                </figure>
            </aside>

            <section class="panel">
                <form action="/calculate" method="post">
                    <fieldset>
                        <legend>Elbow</legend>
                        <div class="fields">
                            <div class="field">
                                <label for="flexion">Flexion <span class="range">69° – 179°</span></label>
                                <div class="input-wrap">
                                    <input type="number" id="flexion" name="flexion" required value="145" min="69" max="179" step="any" inputmode="decimal">
                                    <span class="unit">°</span>
                                </div>
                            </div>
                            <div class="field">
                                <label for="extension">Extension <span class="range">-5° – 7°</span></label>
                                <div class="input-wrap">
                                    <input type="number" id="extension" name="extension" required value="1" min="-5" max="7" step="any" inputmode="decimal">
                                    <span class="unit">°</span>
                                </div>
                            </div>
                            <div class="field">
                                <label for="pronation">Pronation <span class="range">30° – 99°</span></label>
                                <div class="input-wrap">
                                    <input type="number" id="pronation" name="pronation" required value="80" min="30" max="99" step="any" inputmode="decimal">
                                    <span class="unit">°</span>
                                </div>
                            </div>
                            <div class="field">
                                <label for="supination">Supination <span class="range">0° – 99°</span></label>
                                <div class="input-wrap">
                                    <input type="number" id="supination" name="supination" required value="86" min="0" max="99" step="any" inputmode="decimal">
                                    <span class="unit">°</span>
                                </div>
                            </div>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Wrist</legend>
                        <div class="fields">
                            <div class="field">
                                <label for="wextension">Wrist Extension <span class="range">20° – 74°</span></label>
                                <div class="input-wrap">
                                    <input type="number" id="wextension" name="wextension" required value="55" min="20" max="74" step="any" inputmode="decimal">
                                    <span class="unit">°</span>
                                </div>
                            </div>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Pain Level</legend>
                        <div class="segmented" role="radiogroup" aria-label="Pain Level">
                            <input type="radio" id="pain-none" name="painlevel" value="None" checked>
                            <label for="pain-none">None</label>
                            <input type="radio" id="pain-low" name="painlevel" value="Low">
                            <label for="pain-low">Low</label>
                            <input type="radio" id="pain-moderate" name="painlevel" value="Moderate">
                            <label for="pain-moderate">Moderate</label>
                            <input type="radio" id="pain-severe" name="painlevel" value="Severe">
                            <label for="pain-severe">Severe</label>
                        </div>
                    </fieldset>

                    <button type="submit" class="btn">Analyze elbow</button>
                    <p class="note">Values outside the ranges shown can’t be scored by the model.</p>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
